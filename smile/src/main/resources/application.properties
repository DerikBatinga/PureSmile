spring.application.name=smile

# SQL Server: credenciais vindas de variaveis de ambiente (nao versionar segredos)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=puresmile;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Nao falha a subida da aplicacao quando o banco ainda nao esta disponivel
spring.datasource.hikari.initialization-fail-timeout=-1
