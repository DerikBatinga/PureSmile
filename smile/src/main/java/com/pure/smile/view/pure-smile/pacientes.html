<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pure Smile — Pacientes</title>
<script>(function(){var t=localStorage.getItem('ps-theme'); if(t) document.documentElement.setAttribute('data-theme', t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
</head>
<body>
<div class="app-shell" id="ps-app-shell">
  <aside class="sidebar" id="ps-sidebar"></aside>
  <div>
    <header class="topbar" id="ps-topbar"></header>
    <main class="content">
      <div class="card">
        <div class="card-pad" style="padding-bottom:0;">
          <div class="table-toolbar">
            <div class="table-toolbar__filters">
              <div class="filter-chip is-active" data-status="todos"><i class="ri-list-check-2"></i> Todos</div>
              <div class="filter-chip" data-status="ativo"><i class="ri-checkbox-circle-line"></i> Ativos</div>
              <div class="filter-chip" data-status="pendente"><i class="ri-time-line"></i> Pendentes</div>
              <div class="filter-chip" data-status="inativo"><i class="ri-pause-circle-line"></i> Inativos</div>
            </div>
            <div class="flex gap-3">
              <div class="topbar__search" style="max-width:260px;">
                <i class="ri-search-line"></i>
                <input type="text" id="patientSearch" placeholder="Buscar por nome ou CPF...">
              </div>
              <button class="btn btn-accent" id="btnNewPatient"><i class="ri-user-add-line"></i> Novo Paciente</button>
            </div>
          </div>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th data-sort="name">Paciente <i class="ri-arrow-up-down-line"></i></th>
                <th data-sort="cpf">CPF</th>
                <th data-sort="phone">Telefone</th>
                <th data-sort="covenant">Convênio</th>
                <th data-sort="status">Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="patientsTbody"></tbody>
          </table>
        </div>

        <div id="patientsEmpty" style="display:none;">
          <div class="empty-state">
            <lord-icon src="https://cdn.lordicon.com/msoeawqm.json" trigger="loop" delay="2000" colors="primary:#5e81ac,secondary:#394e6e" style="width:96px;height:96px"></lord-icon>
            <h4>Nenhum paciente encontrado</h4>
            <p>Tente ajustar a busca ou os filtros aplicados.</p>
            <button class="btn btn-secondary btn-sm" id="btnClearFilters">Limpar filtros</button>
          </div>
        </div>

        <div class="pagination card-pad" style="padding-top:var(--sp-4);">
          <span id="paginationInfo"></span>
          <div class="pagination__pages" id="paginationPages"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- MODAL NOVO PACIENTE -->
<div class="modal-overlay" id="modalNewPatient">
  <div class="modal modal-lg">
    <div class="modal__header">
      <div>
        <h3>Novo paciente</h3>
        <p>Preencha os dados abaixo para cadastrar um novo paciente na clínica.</p>
      </div>
      <button class="modal-close" data-close-modal><i class="ri-close-line"></i></button>
    </div>
    <div class="modal__body">
      <form id="formNewPatient">
        <div class="form-grid">
          <div class="field span-2">
            <label>Nome completo</label>
            <input class="input" placeholder="Ex: Marina Souza Alves" required>
          </div>
          <div class="field">
            <label>CPF</label>
            <input class="input" placeholder="000.000.000-00" required>
          </div>
          <div class="field">
            <label>RG</label>
            <input class="input" placeholder="00.000.000-0">
          </div>
          <div class="field">
            <label>Data de nascimento</label>
            <input class="input" type="date" required>
          </div>
          <div class="field">
            <label>Telefone</label>
            <input class="input" placeholder="(11) 99999-0000" required>
          </div>
          <div class="field span-2">
            <label>E-mail</label>
            <input class="input" type="email" placeholder="paciente@email.com">
          </div>
          <div class="field span-2">
            <label>Endereço</label>
            <input class="input" placeholder="Rua, número, bairro, cidade">
          </div>
          <div class="field">
            <label>Convênio</label>
            <div class="select-wrap">
              <select class="input">
                <option>Particular</option>
                <option>Amil Dental</option>
                <option>SulAmérica Odonto</option>
                <option>Bradesco Dental</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label>Status</label>
            <div class="select-wrap">
              <select class="input">
                <option>Ativo</option>
                <option>Pendente</option>
                <option>Inativo</option>
              </select>
            </div>
          </div>
          <div class="field span-2">
            <label>Observações</label>
            <textarea class="input" placeholder="Alergias, histórico relevante, preferências..."></textarea>
          </div>
        </div>
      </form>
    </div>
    <div class="modal__footer">
      <button class="btn btn-secondary" data-close-modal>Cancelar</button>
      <button class="btn btn-primary" id="btnSavePatient"><i class="ri-save-3-line"></i> Salvar paciente</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/common.js"></script>
<script src="js/theme.js"></script>
<script src="js/toast.js"></script>
<script src="js/layout.js"></script>
<script src="js/pacientes.js"></script>
</body>
</html>
