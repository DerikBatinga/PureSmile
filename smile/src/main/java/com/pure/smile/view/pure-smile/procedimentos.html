<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pure Smile — Procedimentos</title>
<script>(function(){var t=localStorage.getItem('ps-theme'); if(t) document.documentElement.setAttribute('data-theme', t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<style>
  .proc-type-icon{ width:34px; height:34px; border-radius:var(--r-sm); display:flex; align-items:center; justify-content:center; font-size:16px; background:var(--accent-soft); color:var(--accent); }
</style>
</head>
<body>
<div class="app-shell" id="ps-app-shell">
  <aside class="sidebar" id="ps-sidebar"></aside>
  <div>
    <header class="topbar" id="ps-topbar"></header>
    <main class="content">
      <div class="dash-grid" id="procStats" style="display:grid; grid-template-columns:repeat(4,1fr); gap:var(--sp-5); margin-bottom:var(--sp-6);"></div>

      <div class="card">
        <div class="card-pad" style="padding-bottom:0;">
          <div class="table-toolbar">
            <div class="table-toolbar__filters" id="procFilters">
              <div class="filter-chip is-active" data-type="todos"><i class="ri-list-check-2"></i> Todos</div>
              <div class="filter-chip" data-type="Limpeza"><i class="ri-sparkling-2-line"></i> Limpeza</div>
              <div class="filter-chip" data-type="Canal"><i class="ri-syringe-line"></i> Canal</div>
              <div class="filter-chip" data-type="Extração"><i class="ri-scissors-cut-line"></i> Extração</div>
              <div class="filter-chip" data-type="Ortodontia"><i class="ri-magic-line"></i> Ortodontia</div>
              <div class="filter-chip" data-type="Implante"><i class="ri-tools-line"></i> Implante</div>
            </div>
            <button class="btn btn-accent" id="btnNewProcedure"><i class="ri-add-line"></i> Registrar procedimento</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>Paciente</th><th>Dentista</th><th>Procedimento</th><th>Valor</th><th>Data</th><th>Status</th></tr>
            </thead>
            <tbody id="procTbody"></tbody>
          </table>
        </div>
        <div id="procEmpty" style="display:none;">
          <div class="empty-state">
            <lord-icon src="https://cdn.lordicon.com/msoeawqm.json" trigger="loop" delay="2000" colors="primary:#5e81ac,secondary:#394e6e" style="width:96px;height:96px"></lord-icon>
            <h4>Nenhum procedimento encontrado</h4>
            <p>Ajuste o filtro selecionado ou registre um novo procedimento.</p>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- MODAL NOVO PROCEDIMENTO -->
<div class="modal-overlay" id="modalNewProcedure">
  <div class="modal">
    <div class="modal__header">
      <div><h3>Registrar procedimento</h3><p>Associe o procedimento realizado ao paciente e ao dentista responsável.</p></div>
      <button class="modal-close" data-close-modal><i class="ri-close-line"></i></button>
    </div>
    <div class="modal__body">
      <form id="formNewProcedure">
        <div class="field"><label>Paciente</label><div class="select-wrap"><select class="input" id="procPatient"></select></div></div>
        <div class="field"><label>Dentista</label><div class="select-wrap"><select class="input" id="procDentist"></select></div></div>
        <div class="form-grid">
          <div class="field"><label>Tipo de procedimento</label>
            <div class="select-wrap">
              <select class="input" id="procType">
                <option>Limpeza</option><option>Canal</option><option>Extração</option><option>Ortodontia</option><option>Implante</option>
              </select>
            </div>
          </div>
          <div class="field"><label>Valor (R$)</label><input class="input" type="number" id="procValue" placeholder="0,00"></div>
        </div>
        <div class="field"><label>Data</label><input class="input" type="date" id="procDate"></div>
      </form>
    </div>
    <div class="modal__footer">
      <button class="btn btn-secondary" data-close-modal>Cancelar</button>
      <button class="btn btn-primary" id="btnSaveProcedure"><i class="ri-save-3-line"></i> Registrar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/common.js"></script>
<script src="js/theme.js"></script>
<script src="js/toast.js"></script>
<script src="js/layout.js"></script>
<script src="js/procedimentos.js"></script>
</body>
</html>
