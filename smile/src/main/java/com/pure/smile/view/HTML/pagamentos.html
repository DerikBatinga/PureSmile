<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Smile — Pagamentos</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/shell.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pagamentos.css">

    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800">

    <script>
        const tema = localStorage.getItem('ps-tema')
        document.documentElement.setAttribute('data-theme', tema || 'dark')
    </script>
</head>
<body>

<div class="app-shell" id="ps-app-shell">
    <aside class="sidebar" id="ps-sidebar"></aside>
    <div>
        <header class="topbar" id="ps-topbar"></header>

        <main class="content">
            <div id="conteudoPagamentos"></div>
        </main>
    </div>
</div>

<!-- MODAL: registrar recebimento -->
<div class="modal-fundo" id="modalRegistrarPagamento">
    <div class="modal">
        <div class="modal-cabecalho">
            <div>
                <h3>Registrar pagamento</h3>
                <p>Marque um recebimento ou pague uma pendência do paciente.</p>
            </div>
            <button class="fechar-modal" data-fechar-modal><i class="ri-close-line"></i></button>
        </div>

        <form class="modal-corpo" id="formPagamento">
            <div class="campo">
                <label>Paciente</label>
                <select class="input" id="fPagPaciente"></select>
            </div>
            <div class="campo">
                <label>Valor (R$)</label>
                <input class="input" type="number" id="fPagValor" min="0" step="10" placeholder="0,00" required>
            </div>
            <div class="campo">
                <label>Método</label>
                <select class="input" id="fPagMetodo">
                    <option>Pix</option>
                    <option>Cartão de Crédito</option>
                    <option>Dinheiro</option>
                    <option>Convênio</option>
                    <option>Boleto</option>
                </select>
            </div>
        </form>

        <div class="modal-rodape">
            <button class="btn btn-secundario" data-fechar-modal>Cancelar</button>
            <button class="btn btn-primario" id="btnSalvarPagamento"><i class="ri-check-line"></i> Confirmar recebimento</button>
        </div>
    </div>
</div>

<script src="../JS/main.js"></script>
<script src="../JS/layout.js"></script>
<script src="../JS/dados.js"></script>
<script src="../JS/auxiliares.js"></script>
<script src="../JS/pagamentos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
</body>
</html>
