<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pure Smile — Perfil</title>
<script>(function(){var t=localStorage.getItem('ps-theme'); if(t) document.documentElement.setAttribute('data-theme', t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<style>
  .profile-layout{ display:grid; grid-template-columns:320px 1fr; gap:var(--sp-5); align-items:start; }
  @media(max-width:980px){ .profile-layout{ grid-template-columns:1fr; } }
  .profile-card{ text-align:center; padding:var(--sp-7) var(--sp-6); }
  .profile-card img{ width:96px; height:96px; border-radius:50%; object-fit:cover; margin:0 auto var(--sp-4); border:3px solid var(--surface); box-shadow:var(--shadow-md); }
  .profile-card h3{ font-size:var(--fs-lg); }
  .profile-card p{ color:var(--text-2); font-size:var(--fs-sm); margin-top:2px; }
  .profile-tag{ display:inline-flex; margin-top:var(--sp-3); }
  .profile-stats{ display:flex; justify-content:center; gap:var(--sp-6); margin-top:var(--sp-6); padding-top:var(--sp-6); border-top:1px solid var(--border); }
  .profile-stats div strong{ display:block; font-family:var(--font-display); font-size:var(--fs-lg); }
  .profile-stats div span{ font-size:11px; color:var(--text-2); }

  .profile-tabs{ display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:var(--sp-6); }
  .profile-tab{ padding:10px 16px; font-size:var(--fs-sm); font-weight:600; color:var(--text-2); cursor:pointer; border-bottom:2px solid transparent; }
  .profile-tab.is-active{ color:var(--primary); border-color:var(--primary); }
  .profile-panel{ display:none; }
  .profile-panel.is-active{ display:block; }
</style>
</head>
<body>
<div class="app-shell" id="ps-app-shell">
  <aside class="sidebar" id="ps-sidebar"></aside>
  <div>
    <header class="topbar" id="ps-topbar"></header>
    <main class="content">
      <div class="profile-layout">
        <div class="card profile-card" id="profileSideCard"></div>

        <div class="card card-pad">
          <div class="profile-tabs">
            <div class="profile-tab is-active" data-tab="editar">Editar perfil</div>
            <div class="profile-tab" data-tab="senha">Alterar senha</div>
            <div class="profile-tab" data-tab="preferencias">Preferências</div>
          </div>

          <div class="profile-panel is-active" data-panel="editar">
            <div class="form-grid" id="formEditar"></div>
            <button class="btn btn-primary mt-4" id="btnSaveProfile"><i class="ri-save-3-line"></i> Salvar alterações</button>
          </div>

          <div class="profile-panel" data-panel="senha">
            <div class="field"><label>Senha atual</label><input class="input" type="password" placeholder="••••••••"></div>
            <div class="form-grid">
              <div class="field"><label>Nova senha</label><input class="input" type="password" placeholder="••••••••"></div>
              <div class="field"><label>Confirmar nova senha</label><input class="input" type="password" placeholder="••••••••"></div>
            </div>
            <div class="alert alert-info mb-4"><i class="ri-shield-check-line"></i> Use ao menos 8 caracteres, com letras e números.</div>
            <button class="btn btn-primary" id="btnChangePassword"><i class="ri-lock-2-line"></i> Atualizar senha</button>
          </div>

          <div class="profile-panel" data-panel="preferencias">
            <div class="field">
              <label>Tema da interface</label>
              <div class="flex gap-3 mt-2">
                <button class="btn btn-secondary btn-sm" data-action="toggle-theme"><i class="ri-contrast-2-line"></i> Alternar claro/escuro</button>
              </div>
            </div>
            <div class="divider"></div>
            <label class="checkbox-row mb-4"><input type="checkbox" checked> Receber notificações por e-mail</label>
            <label class="checkbox-row mb-4"><input type="checkbox" checked> Lembretes de consulta por SMS</label>
            <label class="checkbox-row"><input type="checkbox"> Newsletter da clínica</label>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/common.js"></script>
<script src="js/theme.js"></script>
<script src="js/toast.js"></script>
<script src="js/layout.js"></script>
<script src="js/perfil.js"></script>
</body>
</html>
