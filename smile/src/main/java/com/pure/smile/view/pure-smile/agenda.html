<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pure Smile — Agenda</title>
<script>(function(){var t=localStorage.getItem('ps-theme'); if(t) document.documentElement.setAttribute('data-theme', t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<style>
  .agenda-toolbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--sp-5); flex-wrap:wrap; gap:var(--sp-3); }
  .agenda-view-switch{ display:flex; gap:4px; background:var(--card-alt); border-radius:var(--r-md); padding:4px; }
  .agenda-view-switch button{ border:none; background:none; padding:8px 16px; border-radius:8px; font-size:var(--fs-xs); font-weight:600; color:var(--text-2); cursor:pointer; }
  .agenda-view-switch button.is-active{ background:var(--surface); color:var(--primary); box-shadow:var(--shadow-sm); }
  .agenda-legend{ display:flex; gap:var(--sp-4); flex-wrap:wrap; }
  .agenda-legend span{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-2); }
  .agenda-legend i{ width:9px; height:9px; border-radius:3px; display:inline-block; }

  .calendar{ display:grid; grid-template-columns:64px repeat(7, 1fr); border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden; background:var(--surface); }
  .calendar.view-day{ grid-template-columns:64px 1fr; }
  .cal-head{ padding:var(--sp-3); text-align:center; border-bottom:1px solid var(--border); border-left:1px solid var(--border); background:var(--card-alt); }
  .cal-head:first-child{ border-left:none; }
  .cal-head strong{ display:block; font-size:var(--fs-sm); }
  .cal-head span{ font-size:11px; color:var(--text-2); }
  .cal-head.is-today{ background:var(--primary-soft); }
  .cal-head.is-today strong{ color:var(--primary); }

  .cal-time-col{ display:flex; flex-direction:column; }
  .cal-time-slot{ height:76px; text-align:right; padding-right:8px; font-size:10.5px; color:var(--text-3); border-top:1px solid var(--border); transform:translateY(-6px); }
  .cal-time-slot:first-child{ border-top:none; }

  .cal-day-col{ position:relative; border-left:1px solid var(--border); background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 75px, var(--border) 75px, var(--border) 76px); }
  .cal-day-col.drag-over{ background-color:var(--primary-soft); }

  .cal-event{
    position:absolute; left:4px; right:4px; border-radius:8px; padding:6px 8px;
    font-size:11px; font-weight:600; color:#fff; cursor:grab; overflow:hidden;
    box-shadow:var(--shadow-sm); border-left:3px solid rgba(0,0,0,.15);
    transition:transform var(--t-fast) var(--ease);
  }
  .cal-event:hover{ transform:scale(1.02); z-index:5; }
  .cal-event span{ display:block; font-weight:400; font-size:10px; opacity:.9; }
  .cal-event.st-confirmada{ background:var(--primary); }
  .cal-event.st-em-andamento{ background:#B36A00; }
  .cal-event.st-cancelada{ background:var(--text-3); text-decoration:line-through; }
  .cal-event.st-concluida{ background:#2E8A44; }
</style>
</head>
<body>
<div class="app-shell" id="ps-app-shell">
  <aside class="sidebar" id="ps-sidebar"></aside>
  <div>
    <header class="topbar" id="ps-topbar"></header>
    <main class="content">
      <div class="agenda-toolbar">
        <div class="flex items-center gap-3">
          <div class="agenda-view-switch">
            <button class="is-active" data-view="week">Semanal</button>
            <button data-view="day">Diário</button>
          </div>
          <div class="agenda-legend">
            <span><i style="background:var(--primary)"></i>Confirmada</span>
            <span><i style="background:#B36A00"></i>Em andamento</span>
            <span><i style="background:#2E8A44"></i>Concluída</span>
            <span><i style="background:var(--text-3)"></i>Cancelada</span>
          </div>
        </div>
        <button class="btn btn-accent" id="btnNewAppointment"><i class="ri-calendar-event-line"></i> Agendar consulta</button>
      </div>

      <div class="calendar" id="calendarGrid"></div>
      <p class="text-xs text-muted mt-4"><i class="ri-drag-move-2-line"></i> Arraste um card para outro dia para reagendar (demonstração visual).</p>
    </main>
  </div>
</div>

<!-- MODAL AGENDAMENTO -->
<div class="modal-overlay" id="modalAppointment">
  <div class="modal">
    <div class="modal__header">
      <div>
        <h3 id="apptModalTitle">Nova consulta</h3>
        <p>Defina paciente, dentista e horário do atendimento.</p>
      </div>
      <button class="modal-close" data-close-modal><i class="ri-close-line"></i></button>
    </div>
    <div class="modal__body">
      <form id="formAppointment">
        <div class="field">
          <label>Paciente</label>
          <div class="select-wrap"><select class="input" id="apptPatient"></select></div>
        </div>
        <div class="field">
          <label>Dentista</label>
          <div class="select-wrap"><select class="input" id="apptDentist"></select></div>
        </div>
        <div class="form-grid">
          <div class="field"><label>Dia da semana</label>
            <div class="select-wrap">
              <select class="input" id="apptDay">
                <option value="1">Segunda</option><option value="2">Terça</option><option value="3">Quarta</option>
                <option value="4">Quinta</option><option value="5">Sexta</option><option value="6">Sábado</option><option value="7">Domingo</option>
              </select>
            </div>
          </div>
          <div class="field"><label>Horário</label><input class="input" type="time" id="apptTime" value="09:00"></div>
        </div>
        <div class="field">
          <label>Procedimento</label>
          <input class="input" id="apptProcedure" placeholder="Ex: Limpeza, Canal, Avaliação...">
        </div>
      </form>
    </div>
    <div class="modal__footer">
      <button class="btn btn-secondary" data-close-modal>Cancelar</button>
      <button class="btn btn-primary" id="btnSaveAppointment"><i class="ri-check-line"></i> Confirmar agendamento</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/common.js"></script>
<script src="js/theme.js"></script>
<script src="js/toast.js"></script>
<script src="js/layout.js"></script>
<script src="js/agenda.js"></script>
</body>
</html>
