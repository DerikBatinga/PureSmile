<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pure Smile — Configurações</title>
<script>(function(){var t=localStorage.getItem('ps-theme'); if(t) document.documentElement.setAttribute('data-theme', t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<style>
  .settings-layout{ display:grid; grid-template-columns:240px 1fr; gap:var(--sp-5); align-items:start; }
  @media(max-width:920px){ .settings-layout{ grid-template-columns:1fr; } }
  .settings-nav{ display:flex; flex-direction:column; gap:2px; }
  .settings-nav-item{ display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:var(--r-md); font-size:var(--fs-sm); font-weight:600; color:var(--text-2); cursor:pointer; }
  .settings-nav-item:hover{ background:var(--card-alt); }
  .settings-nav-item.is-active{ background:var(--primary-soft); color:var(--primary); }
  .settings-panel{ display:none; }
  .settings-panel.is-active{ display:block; }

  .theme-preview{ display:flex; gap:var(--sp-4); }
  .theme-swatch{ flex:1; border:2px solid var(--border); border-radius:var(--r-md); padding:var(--sp-4); cursor:pointer; text-align:center; }
  .theme-swatch.is-active{ border-color:var(--primary); }
  .theme-swatch .preview-box{ height:60px; border-radius:8px; margin-bottom:8px; }

  .user-row{ display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) 0; border-bottom:1px solid var(--border); }
  .user-row:last-child{ border-bottom:none; }
  .user-row img{ width:38px; height:38px; border-radius:50%; object-fit:cover; }
</style>
</head>
<body>
<div class="app-shell" id="ps-app-shell">
  <aside class="sidebar" id="ps-sidebar"></aside>
  <div>
    <header class="topbar" id="ps-topbar"></header>
    <main class="content">
      <div class="settings-layout">
        <nav class="card card-pad settings-nav" id="settingsNav">
          <div class="settings-nav-item is-active" data-panel="preferencias"><i class="ri-sliders-line"></i> Preferências</div>
          <div class="settings-nav-item" data-panel="seguranca"><i class="ri-shield-keyhole-line"></i> Segurança</div>
          <div class="settings-nav-item" data-panel="usuarios" id="navUsuarios"><i class="ri-team-line"></i> Gestão de usuários</div>
          <div class="settings-nav-item" data-panel="aparencia"><i class="ri-palette-line"></i> Aparência</div>
          <div class="settings-nav-item" data-panel="notificacoes"><i class="ri-notification-3-line"></i> Notificações</div>
        </nav>

        <div class="card card-pad">
          <div class="settings-panel is-active" data-panel="preferencias">
            <div class="section-title"><h3>Preferências gerais</h3></div>
            <div class="field"><label>Idioma</label><div class="select-wrap"><select class="input"><option>Português (Brasil)</option><option>English</option></select></div></div>
            <div class="field"><label>Fuso horário</label><div class="select-wrap"><select class="input"><option>América/São Paulo (GMT-3)</option></select></div></div>
            <label class="checkbox-row mb-4"><input type="checkbox" checked> Exibir agenda em formato de 24 horas</label>
            <label class="checkbox-row"><input type="checkbox" checked> Confirmar antes de cancelar consultas</label>
          </div>

          <div class="settings-panel" data-panel="seguranca">
            <div class="section-title"><h3>Segurança da conta</h3></div>
            <div class="alert alert-info mb-4"><i class="ri-shield-check-line"></i> Sua conta está protegida com autenticação por senha.</div>
            <label class="checkbox-row mb-4"><input type="checkbox"> Ativar autenticação em duas etapas (2FA)</label>
            <label class="checkbox-row mb-4"><input type="checkbox" checked> Notificar sobre novos acessos</label>
            <button class="btn btn-secondary btn-sm"><i class="ri-history-line"></i> Ver histórico de acessos</button>
          </div>

          <div class="settings-panel" data-panel="usuarios">
            <div class="section-title"><h3>Gestão de usuários</h3><button class="btn btn-accent btn-sm" onclick="PSToast('Convite enviado por e-mail.','success')"><i class="ri-user-add-line"></i> Convidar usuário</button></div>
            <div id="usersList"></div>
          </div>

          <div class="settings-panel" data-panel="aparencia">
            <div class="section-title"><h3>Aparência</h3></div>
            <p class="text-sm text-muted mb-4">Escolha como o Pure Smile deve aparecer para você.</p>
            <div class="theme-preview">
              <div class="theme-swatch" id="swatchLight">
                <div class="preview-box" style="background:#F9F9FB; border:1px solid #E7EAF2;"></div>
                <strong class="text-sm">Claro</strong>
              </div>
              <div class="theme-swatch" id="swatchDark">
                <div class="preview-box" style="background:#111827;"></div>
                <strong class="text-sm">Escuro</strong>
              </div>
            </div>
          </div>

          <div class="settings-panel" data-panel="notificacoes">
            <div class="section-title"><h3>Notificações</h3></div>
            <label class="checkbox-row mb-4"><input type="checkbox" checked> Novas consultas agendadas</label>
            <label class="checkbox-row mb-4"><input type="checkbox" checked> Pagamentos recebidos</label>
            <label class="checkbox-row mb-4"><input type="checkbox"> Cancelamentos</label>
            <label class="checkbox-row"><input type="checkbox" checked> Resumo semanal por e-mail</label>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/common.js"></script>
<script src="js/theme.js"></script>
<script src="js/toast.js"></script>
<script src="js/layout.js"></script>
<script src="js/configuracoes.js"></script>
</body>
</html>
